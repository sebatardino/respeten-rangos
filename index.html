<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<title>Respeten Rangos FC</title>
<link rel="icon" href="https://i.postimg.cc/sXGTPVyV/respeten-rangos-logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070B0A; --card:rgba(25,32,28,0.7); --card2:rgba(15,20,18,0.9); --border:rgba(255,92,0,0.15); --muted:#8FA397; --fg:#F5F5F5;
  --orange:#FF5C00; --orange-ink:#000000;
  --arq:#F59E0B; --def:#3B82F6; --med:#22C55E; --del:#EF4444;
  --win:#22C55E; --loss:#EF4444; --draw:#8A8A8A;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body,#root{height:100%;background:var(--bg);color:var(--fg)}
body{font-family:'Archivo',system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.35;font-feature-settings:"ss01","cv11";overflow-x:hidden}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
a{color:inherit;text-decoration:none}

.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;padding-bottom:80px;background:radial-gradient(circle at top right, #0f241a, #070B0A 60%);}
@media (min-width:600px){.app{box-shadow:0 0 0 1px #1a1a1a;border-left:1px solid #111;border-right:1px solid #111}}

/* Typography helpers */
.display{font-family:'Archivo Black',Archivo,sans-serif;letter-spacing:-.01em;line-height:.95}
.mono{font-variant-numeric:tabular-nums}
.upper{text-transform:uppercase;letter-spacing:.08em}

/* Section label "// TEXT" */
.sl{color:var(--muted);font-size:11px;letter-spacing:.15em;text-transform:uppercase;font-weight:500;margin:22px 4px 10px}
.sl::before{content:"// ";color:var(--orange);font-weight:700}

/* Top bar */
.tbar{position:sticky;top:0;z-index:30;background:var(--bg);padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid transparent}
.tbar .title{font-family:'Archivo Black';font-size:22px;letter-spacing:-.01em}
.tbar .title b{color:var(--orange)}
.tbar .back{width:36px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;color:var(--fg);font-size:18px}
.tbar .logo{width:38px;height:38px;border-radius:10px;overflow:hidden;background:var(--orange);display:grid;place-items:center}
.tbar .logo img{width:100%;height:100%;object-fit:cover}

/* Hero logo */
.hero{position:relative;margin:6px -16px 4px;padding:22px 16px 18px;text-align:center;background:
  radial-gradient(ellipse at top,rgba(255,92,0,.15),transparent 60%),
  linear-gradient(180deg,#0a150e 0%, transparent 100%);
  border-bottom:1px solid var(--border);overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(45deg,rgba(255,92,0,.03) 0 2px,transparent 2px 14px);
  pointer-events:none;opacity:.6}
.hero .brand{position:relative;display:inline-flex;flex-direction:column;align-items:center;gap:8px}
.hero .shield{width:112px;height:112px;display:grid;place-items:center;filter:drop-shadow(0 14px 30px rgba(255,92,0,.2))}
.hero .shield svg{width:100%;height:100%}
.hero .brand h1{font-family:'Archivo Black';font-size:26px;letter-spacing:-.01em;line-height:.95;margin:0}
.hero .brand h1 b{color:var(--orange)}
.hero .brand .tag{font-size:10px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase;font-weight:700}

/* Cards */
.card{background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:14px;padding:14px;position:relative;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.3)}
.card::after{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,92,0,0.3),transparent)}
.card.tight{padding:10px}
.card.accent{background:linear-gradient(135deg,rgba(255,92,0,0.08) 0%, rgba(15,20,18,0.8) 70%);border-color:rgba(255,92,0,0.25)}
.card.ghost{background:transparent;border:1px dashed var(--border)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 14px;border-radius:0;clip-path:polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:14px;border:1px solid transparent;transition:transform .05s, background .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--orange);color:var(--orange-ink)}
.btn.outline{background:transparent;border-color:var(--border);color:var(--fg)}
.btn.ghost{background:transparent;color:var(--fg)}
.btn.danger{background:transparent;color:var(--loss)}
.btn.sm{height:32px;padding:0 10px;font-size:12px;border-radius:10px}
.btn.block{width:100%}
.fab{position:fixed;right:max(16px,calc(50vw - 216px));bottom:96px;width:52px;height:52px;border-radius:14px;background:var(--orange);color:var(--orange-ink);display:grid;place-items:center;font-size:26px;font-weight:800;box-shadow:0 10px 30px rgba(255,92,0,.35);z-index:20}

/* Bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;justify-content:center;pointer-events:none}
.nav .inner{pointer-events:auto;width:100%;max-width:480px;background:rgba(20,20,20,.92);backdrop-filter:blur(10px);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 6px;border-radius:12px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em}
.nav button.active{background:var(--orange);color:var(--orange-ink)}
.nav svg{width:22px;height:22px}

/* Tab pills */
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px 0}
.tabs::-webkit-scrollbar{display:none}
.pill{padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--fg);font-weight:700;font-size:12px;letter-spacing:.05em;white-space:nowrap;text-transform:uppercase}
.pill.active{background:var(--orange);color:var(--orange-ink);border-color:var(--orange)}
.pill .badge{margin-left:6px;background:rgba(0,0,0,.2);padding:1px 6px;border-radius:6px;font-size:10px}

/* Position color strip */
.pos-strip{width:4px;border-radius:4px;align-self:stretch}
[data-pos=ARQUERO]{--pc:var(--arq)} [data-pos=DEFENSOR]{--pc:var(--def)} [data-pos=MEDIO]{--pc:var(--med)} [data-pos=DELANTERO]{--pc:var(--del)}
.pos-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;letter-spacing:.08em;padding:2px 6px;border-radius:6px;background:color-mix(in srgb,var(--pc) 20%,transparent);color:var(--pc);text-transform:uppercase}

/* Player row */
.prow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 12px 12px 16px;position:relative;overflow:hidden;min-height:58px}
.prow::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pc)}
.prow .num{width:36px;height:36px;border-radius:10px;background:color-mix(in srgb,var(--pc) 18%,transparent);color:var(--pc);display:grid;place-items:center;font-weight:800;font-size:14px;flex-shrink:0}
.prow .name{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;justify-content:center}
.prow .name b{display:block;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.prow .name span{color:var(--muted);font-size:11px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Check */
.chk{width:24px;height:24px;border-radius:8px;border:1.5px solid var(--border);background:var(--card2);display:grid;place-items:center;flex-shrink:0;transition:.15s}
.chk.on{background:var(--orange);border-color:var(--orange);color:#0D0D0D}
.chk svg{width:14px;height:14px}

/* Progress bar */
.bar{position:relative;height:10px;background:var(--card2);border-radius:99px;overflow:hidden;border:1px solid var(--border)}
.bar>span{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--orange),#ff8a40);border-radius:99px}

/* Chip options (time played etc.) */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 10px;border-radius:8px;background:var(--card2);border:1px solid var(--border);color:var(--muted);font-weight:700;font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.chip.on{background:var(--orange);color:var(--orange-ink);border-color:var(--orange)}
.chip.tit.on{background:#facc15;color:#0D0D0D;border-color:#facc15}

/* Inputs */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.input, .select{height:42px;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:0 12px;font-size:14px;color:var(--fg);width:100%}
textarea.input{height:auto;padding:10px 12px;resize:vertical;min-height:80px}
.input:focus, .select:focus{outline:none;border-color:var(--orange)}

/* Table posiciones */
.table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
.table th{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;padding:8px 6px;text-align:center;font-weight:600}
.table td{padding:10px 6px;text-align:center;border-top:1px solid var(--border);font-weight:700}
.table td.l{text-align:left}
.table th:first-child,.table td:first-child{padding-left:12px;text-align:left}
.table th:last-child,.table td:last-child{padding-right:12px}
.table td .pts{color:var(--orange)}

/* Match list item */
.mrow{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:12px}
.mrow .date{width:46px;text-align:center;flex-shrink:0}
.mrow .date b{display:block;font-family:'Archivo Black';font-size:20px;line-height:1}
.mrow .date span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.mrow .vs{flex:1;min-width:0}
.mrow .vs b{display:block;font-weight:800;text-transform:uppercase;letter-spacing:.02em;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .vs span{color:var(--muted);font-size:11px}
.mrow .score{font-family:'Archivo Black';font-size:22px}
.mrow .score.win{color:var(--win)} .mrow .score.loss{color:var(--loss)} .mrow .score.draw{color:var(--draw)}
.mrow .rbadge{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-family:'Archivo Black';font-size:13px;color:#000}
.mrow .rbadge.G{background:var(--win)} .mrow .rbadge.P{background:var(--loss)} .mrow .rbadge.E{background:var(--draw);color:#fff}

/* Countdown */
.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.countdown div{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:8px 4px;text-align:center}
.countdown b{font-family:'Archivo Black';font-size:22px;display:block;color:var(--orange)}
.countdown span{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}

/* Counters 4 columns */
.counters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.counter{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 6px;text-align:center;position:relative;overflow:hidden}
.counter::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--pc,var(--orange))}
.counter b{font-family:'Archivo Black';font-size:24px;display:block}
.counter span{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{width:100%;max-width:480px;background:var(--card);border:1px solid var(--border);border-top-left-radius:18px;border-top-right-radius:18px;padding:20px 16px 28px;max-height:92vh;overflow-y:auto;animation:slideUp .2s ease-out}
@keyframes slideUp{from{transform:translateY(20px);opacity:.5}to{transform:none;opacity:1}}
.modal h3{font-family:'Archivo Black';font-size:22px;margin-bottom:14px}
.modal .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.modal .row.s1{grid-template-columns:1fr}

/* Pitch */
.pitch{position:relative;aspect-ratio:3/4;background:linear-gradient(180deg,#1e4729 0%, #2d6e3f 50%, #1e4729 100%);border-radius:16px;overflow:hidden;border:1px solid #0d3018}
.pitch svg.lines{position:absolute;inset:0;width:100%;height:100%}
.pitch .slot{position:absolute;transform:translate(-50%,-50%);width:72px}
.shirt{width:60px;margin:0 auto;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4))}
.shirt-num{font-family:'Archivo Black';font-size:16px;fill:#0D0D0D}
.slot-name{text-align:center;font-size:10px;margin-top:2px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8);font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.slot.empty .shirt path{fill:#555;opacity:.45}

/* Pay badges */
.paybtn{height:26px;padding:0 10px;border-radius:7px;font-weight:800;font-size:10px;letter-spacing:.1em;border:1px solid var(--border);background:var(--card2);color:var(--muted);text-transform:uppercase}
.paybtn.etf.on{background:var(--win);color:#000;border-color:var(--win)}
.paybtn.trns.on{background:var(--def);color:#000;border-color:var(--def)}

/* Stats bars */
.sbar{position:relative;height:8px;background:var(--card2);border-radius:99px;overflow:hidden;border:1px solid var(--border)}
.sbar>span{position:absolute;inset:0 auto 0 0;border-radius:99px}
.sbar.asist>span{background:var(--orange)}
.sbar.tit>span{background:var(--win)}
.sbar.sup>span{background:var(--def)}
.sbar.min>span{background:#facc15}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.stat-grid .c{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:8px 6px;text-align:center}
.stat-grid .c small{display:block;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:3px}
.stat-grid .c b{font-family:'Archivo Black';font-size:16px}

/* Empty state */
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty h4{font-family:'Archivo Black';color:var(--fg);font-size:20px;margin-bottom:6px}

/* Misc */
.flex{display:flex} .g8{gap:8px} .g10{gap:10px} .g6{gap:6px}
.between{justify-content:space-between} .center{align-items:center}
.col{display:flex;flex-direction:column}
.mt10{margin-top:10px} .mt14{margin-top:14px} .mt20{margin-top:20px}
.mb10{margin-bottom:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.orange{color:var(--orange)}
.right{text-align:right}
.pad{padding:0 16px}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
hr{border:0;border-top:1px solid var(--border);margin:12px 0}

/* Deudor row */
.deud{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;border-left:3px solid var(--loss)}
.deud b{font-family:'Archivo Black';font-size:16px;color:var(--loss)}

/* Histogram */
.hist{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:120px;padding:10px 0}
.hist div{background:linear-gradient(180deg,var(--orange),#6b2400);border-radius:6px 6px 0 0;min-height:4px;position:relative}
.hist div span{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);text-transform:uppercase}
.hist div.current{background:linear-gradient(180deg,#ffae5c,var(--orange))}
</style>
</head>

<div id="root"></div>

// ============ HELPERS ============
const fmtMoney=n=>"$"+(n||0).toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtMoneyInt=n=>"$"+(n||0).toLocaleString("es-AR",{maximumFractionDigits:0});
const fmtMoneyK=n=>{const x=Math.round((n||0)/1000);return "$"+x+"K"};
const MESES=["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
const STAGES=["LIGA","8VOS","4TOS","SEMI","FINAL"];
const DIAS=["DOM","LUN","MAR","MIE","JUE","VIE","SAB"];
const fmtDate=(iso)=>{if(!iso)return"";const d=new Date(iso+"T00:00:00");return `${d.getDate().toString().padStart(2,"0")}/${(d.getMonth()+1).toString().padStart(2,"0")}`};
const fmtDateLong=(iso)=>{if(!iso)return"";const d=new Date(iso+"T00:00:00");return `${DIAS[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()]}`};
const isPlayed=(m)=>{if(!m||!m.date||!m.time)return false;return new Date(m.date+"T"+m.time)<=new Date()};

function useNow(interval=30000){
  const [n,set]=useState(Date.now());
  useEffect(()=>{const t=setInterval(()=>set(Date.now()),interval);return()=>clearInterval(t)},[interval]);
  return n;
}

// ============ STATS COMPUTE ============
function computeChampStats(champ){
  const played = (champ?.matches||[]).filter(isPlayed);
  let G=0,E=0,P=0,GF=0,GC=0;
  played.forEach(m=>{
    const gf=m.goalsFor||0, gc=m.goalsAgainst||0;
    GF+=gf; GC+=gc;
    if(gf>gc)G++; else if(gf===gc)E++; else P++;
  });
  return {PJ:played.length,G,E,P,GF,GC,DG:GF-GC,PTS:G*3+E};
}

function computePlayerStats(champ){
  const played = (champ?.matches||[]).filter(isPlayed);
  const total = played.length;
  const map = {};
  played.forEach(m=>{
    (m.players||[]).forEach(pp=>{
      const k=pp.id;
      if(!map[k]) map[k]={player:pp,asist:0,tit:0,sup:0,min:0};
      if(pp.available) map[k].asist++;
      if(pp.starter) map[k].tit++;
      if(pp.available && !pp.starter && (pp.timePlayed||0)>0) map[k].sup++;
      map[k].min += (pp.timePlayed||0);
    });
  });
  return {total, rows: Object.values(map).map(r=>({
    ...r,
    asistPct: total?Math.round(r.asist/total*100):0,
    titPct: r.asist?Math.round(r.tit/r.asist*100):0,
    supPct: r.asist?Math.round(r.sup/r.asist*100):0,
    minPct: r.asist?Math.round(r.min/r.asist):0, // % promedio sobre partidos asistidos
    ovr: total?Math.round((r.asist/total*30)+(r.asist?r.tit/r.asist*40:0)+(r.asist?r.min/r.asist:0)*0.30 + (r.asist?r.sup/r.asist*15:0)):50
  }))};
}

  const totalPlayers = (match.players||[]).length;

  const patchPlayer=(pid,patch)=>{
    setState(s=>({...s,champs:s.champs.map(c=>c.id!==champ.id?c:{...c,matches:c.matches.map(m=>m.id!==match.id?m:{...m,players:m.players.map(pp=>pp.id!==pid?{...pp}:{...pp,...patch})})})}));
  };
  const patchMultiplePlayers=(updates)=>{ // updates is {id: patch}
    setState(s=>({...s,champs:s.champs.map(c=>c.id!==champ.id?c:{...c,matches:c.matches.map(m=>m.id!==match.id?m:{...m,players:m.players.map(pp=>updates[pp.id]?{...pp,...updates[pp.id]}:{...pp})})})}));
  };

  const byPos = useMemo(()=>{
    const g={ARQUERO:[],DEFENSOR:[],MEDIO:[],DELANTERO:[]};
    (match.players||[]).forEach(p=>g[p.position]?.push(p));
    Object.keys(g).forEach(k=>g[k].sort((a,b)=>(a.number||99)-(b.number||99)));
    return g;
  },[match]);

  return (<>
    <TBar
      left={<button className="back" onClick={()=>go("matches")}><Icon name="back" size={18}/></button>}
      center={<span className="display" style={{fontSize:16}}>VS {match.rival}</span>}
      right={<button className="btn primary sm" onClick={()=>go("formacion",{matchId:match.id})}>ARMAR XI →</button>}
    />
    <div className="pad">
      <div className="muted" style={{fontSize:11}}>{fmtDateLong(match.date)} · {match.time}{match.callTime && <> · <span style={{color:"var(--orange)"}}>🕐 Citación {match.callTime}</span></>}</div>
      <div className="card mt10">
        <div className="flex between center">
          <div style={{textAlign:"center",flex:1}}>
            <div style={{width:60,height:60,margin:"0 auto",background:"var(--orange)",borderRadius:14,display:"grid",placeItems:"center",fontFamily:"Archivo Black",color:"#0D0D0D",fontSize:18}}>RR</div>
            <div className="mono upper" style={{fontSize:11,marginTop:6}}>RANGOS</div>
          </div>
          <div className="display" style={{fontSize:30}}>{played? `${match.goalsFor??"-"}-${match.goalsAgainst??"-"}` : "VS"}</div>
          <div style={{textAlign:"center",flex:1}}>
            <div style={{width:60,height:60,margin:"0 auto",background:"var(--card2)",borderRadius:14,border:"1px solid var(--border)",display:"grid",placeItems:"center",fontFamily:"Archivo Black",fontSize:18}}>{match.rival?.slice(0,3)}</div>
            <div className="mono upper" style={{fontSize:11,marginTop:6}}>{match.rival}</div>
          </div>
        </div>
        <div className="muted" style={{fontSize:11,textAlign:"center",marginTop:8}}>CANCHA {match.field} · FECHA {match.matchday} {played && <span className="orange" style={{fontWeight:800,marginLeft:8}}>· JUGADO</span>}</div>
        {match.callTime && <div style={{marginTop:8,textAlign:"center",background:"color-mix(in srgb,var(--orange) 12%,transparent)",borderRadius:8,padding:"6px 10px",border:"1px solid color-mix(in srgb,var(--orange) 30%,transparent)"}}>
          <span className="muted upper" style={{fontSize:10}}>🕐 Citación plantel: </span>
          <span style={{fontFamily:"'Archivo Black'",fontSize:14,color:"var(--orange)"}}>{match.callTime} hs</span>
        </div>}
      </div>

      <div className="sl flex between center">
        <span>Disponibles</span>
        <button className="btn sm primary" onClick={()=>setMinutesModal(true)}>⏱ CARGAR MINUTOS</button>
      </div>
      <div className="bar"><span style={{width:(avail/totalPlayers*100)+"%"}}/></div>
      <div className="flex between mt10">
        <div className="muted" style={{fontSize:11}}>{avail<11?`FALTAN ${11-avail} · HAY SILLA QUE VER`:"XI COMPLETO"}</div>
        <div className="display" style={{fontSize:20}}>{avail}/{totalPlayers}</div>
      </div>

      <div className="tabs mb10 mt10">
        <button className={"pill"+(availFilter==="all"?" active":"")} onClick={()=>setAvailFilter("all")}>TODOS</button>
        <button className={"pill"+(availFilter==="yes"?" active":"")} onClick={()=>setAvailFilter("yes")}>SÍ ({avail})</button>
        <button className={"pill"+(availFilter==="no"?" active":"")} onClick={()=>setAvailFilter("no")}>NO ({(match.players||[]).filter(p=>!p.available&&p.unavReason!=="PENDING").length})</button>
        <button className={"pill"+(availFilter==="pending"?" active":"")} onClick={()=>setAvailFilter("pending")}>PENDIENTE ({(match.players||[]).filter(p=>!p.available&&p.unavReason==="PENDING").length})</button>
      </div>

      {POSITIONS.map(pos=>{
        let g = byPos[pos];
        if(!g?.length) return null;
        if(availFilter==="yes") g=g.filter(p=>p.available);
        if(availFilter==="no") g=g.filter(p=>!p.available && p.unavReason!=="PENDING");
        if(availFilter==="pending") g=g.filter(p=>!p.available && p.unavReason==="PENDING");
        if(!g.length) return null;
        const available = g.filter(p=>p.available).length;
        return (
          <div key={pos}>
            <div className="sl" style={{color:POS_COLOR[pos]}}>{pos} <span className="muted" style={{float:"right"}}>{available}/{g.length}</span></div>
            <div className="col g8">
              {g.map(p=>(
                <PlayerAvailRow key={p.id} p={p} onPatch={patch=>patchPlayer(p.id,patch)}/>
              ))}
            </div>
          </div>
        );
      })}

      <div className="mt20" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <button className="btn outline block" onClick={()=>go("caja",{matchId:match.id})}><Icon name="dollar" size={16}/> CAJA</button>
        <button className="btn outline block" onClick={()=>exportMatchPromoPNG(match)}><Icon name="download" size={16}/> PROMO</button>
      </div>
      <button className="btn outline block mt10" onClick={()=>setSquadExportFilter("all")}><Icon name="download" size={16}/> EXPORTAR REPORTE DISPONIBILIDAD</button>
      <div style={{height:20}}/>
    </div>
    {minutesModal && <MinutesModal match={match} onSave={(updates)=>{patchMultiplePlayers(updates);setMinutesModal(false);}} onClose={()=>setMinutesModal(false)}/>}
    {squadExportFilter && <SquadExportModal match={match} onClose={()=>setSquadExportFilter(null)} onExport={(f)=>{exportSquadListPNG(match, f); setSquadExportFilter(null);}} />}
  </>);
}

  const avails = (match.players||[]).filter(p=>p.available);
  const [mins,setMins] = useState(()=>{
    const m={}; avails.forEach(p=>m[p.id]=p.timePlayed||0); return m;
  });
  const up=(id,v)=>setMins({...mins,[id]:v});
  const save=()=>{
    const updates={}; avails.forEach(p=>{if(mins[p.id]!==p.timePlayed)updates[p.id]={timePlayed:mins[p.id]}});
    onSave(updates);
  };
  return (
    <Modal title="Carga Rápida de Minutos" onClose={onClose}>

            <div className="chips mt10" style={{justifyContent:"space-between"}}>
              {[0,25,50,75,100].map(v=>(
                <button key={v} className={"chip"+(mins[p.id]===v?" on":"")} style={{flex:1}} onClick={()=>up(p.id,v)}>{v}</button>
              ))}
            </div>
          </div>
        ))}
      </div>
      <button className="btn primary block mt14" onClick={save}>GUARDAR MINUTOS</button>
    </Modal>
  );
}

// ============ FORMACION SCREEN (manual XI) ============
function FormacionScreen({state,setState,go,matchId}){
  const {champs,activeChamp}=state;
  const champ = champs.find(c=>c.id===activeChamp);
  const match = champ?.matches.find(m=>m.id===matchId);
  const [picker,setPicker]=useState(null); // {idx, role}
  if(!match) return null;

  const lineup = match.lineup || {formation:"4-4-2", slots: Array(11).fill(null)};
  const form = lineup.formation;
  const F = FORMATIONS[form];

  const patchLineup=(nextLineup)=>{
    setState(s=>({...s, champs: s.champs.map(c=>c.id!==champ.id?c:{
      ...c, matches: c.matches.map(m=>{
        if(m.id!==match.id) return m;
        const ids = new Set((nextLineup.slots||[]).filter(Boolean));
        return {...m, lineup: nextLineup, players: m.players.map(pp=>({...pp, starter: ids.has(pp.id)}))};
      })
    })}));
  };
  const setFormation=(f)=>{
    // reset slots cuando cambia formación (los roles difieren)
    patchLineup({formation:f, slots: Array(11).fill(null)});
  };
  const assign=(idx,pid)=>{
    const slots = lineup.slots.map((p,i)=> p===pid ? null : p);
    slots[idx] = pid;
    patchLineup({...lineup, slots});
    setPicker(null);
  };
  const clear=(idx)=>{
    const slots=[...lineup.slots]; slots[idx]=null;
    patchLineup({...lineup, slots});
    setPicker(null);
  };
  const autoFill=()=>{
    const avail=(match.players||[]).filter(p=>p.available);
    const used=new Set();
    const slots = F.roles.map(role=>{
      const pick = avail.find(s=>s.position===role && !used.has(s.id));
      if(pick) used.add(pick.id);
      return pick ? pick.id : null;
    });
    // completar slots vacíos con cualquier disponible
    const rest = avail.filter(a=>!used.has(a.id));
    for(let i=0;i<slots.length;i++){
      if(slots[i]==null && rest.length){
        const pick = rest.shift();
        slots[i] = pick.id; used.add(pick.id);
      }
    }
    patchLineup({...lineup, slots});
  };
  const clearAll=()=>{
    if(!confirm("¿Vaciar XI?")) return;
    patchLineup({...lineup, slots: Array(11).fill(null)});
  };

  const slots = F.lines.map((pos,i)=>{
    const pid = lineup.slots[i];
    const player = pid ? match.players.find(p=>p.id===pid) : null;
    return {idx:i, x:pos[0], y:pos[1], role:F.roles[i], player};
  });
  const filled = slots.filter(s=>s.player).length;
  const starterIds = new Set(lineup.slots.filter(Boolean));
  const suplentes = (match.players||[]).filter(p=>p.available && !starterIds.has(p.id));
  const POS_ORDER = {ARQUERO:0,DEFENSOR:1,MEDIO:2,DELANTERO:3};
  const supSorted = [...suplentes].sort((a,b)=> POS_ORDER[a.position]-POS_ORDER[b.position] || (a.number||99)-(b.number||99));

  return (<>
    <TBar
      left={<button className="back" onClick={()=>go("matchDetail",{matchId:match.id})}><Icon name="back" size={18}/></button>}
      center={<span className="display" style={{fontSize:16}}>XI TITULAR</span>}
      right={<div className="display orange" style={{fontSize:18}}>{filled}/11</div>}
    />
    <div className="pad">
      <div className="sl">Formación</div>
      <div className="tabs">
        {Object.keys(FORMATIONS).map(k=>(
          <button key={k} className={"pill"+(form===k?" active":"")} onClick={()=>setFormation(k)}>{k}</button>
        ))}
      </div>

      <div className="mt14" style={{display:"flex",gap:8,alignItems:"flex-start"}}>
        {/* PITCH */}
        <div className="pitch" style={{flex:"0 0 62%"}}>
          <svg className="lines" viewBox="0 0 100 133" preserveAspectRatio="none">
            <rect x="2" y="2" width="96" height="129" fill="none" stroke="#ffffff55" strokeWidth=".3"/>
            <line x1="2" y1="66.5" x2="98" y2="66.5" stroke="#ffffff55" strokeWidth=".3"/>
            <circle cx="50" cy="66.5" r="10" fill="none" stroke="#ffffff55" strokeWidth=".3"/>
            <rect x="25" y="2" width="50" height="16" fill="none" stroke="#ffffff55" strokeWidth=".3"/>
            <rect x="25" y="115" width="50" height="16" fill="none" stroke="#ffffff55" strokeWidth=".3"/>
            <rect x="38" y="2" width="24" height="7" fill="none" stroke="#ffffff55" strokeWidth=".3"/>
            <rect x="38" y="124" width="24" height="7" fill="none" stroke="#ffffff55" strokeWidth=".3"/>
          </svg>
          {slots.map(s=>(
            <div key={s.idx} className={"slot"+(s.player?"":" empty")} style={{left:s.x+"%",top:s.y+"%",cursor:"pointer"}} onClick={()=>setPicker({idx:s.idx,role:s.role})}>
              <Shirt color={s.player? POS_COLOR[s.player.position] : "#3a3a3a"} number={s.player?.number ?? ""} dim={!s.player}/>
              <div className="slot-name">{s.player? s.player.name.split(" ")[0] : s.role.slice(0,3)}</div>
            </div>
          ))}
        </div>

        {/* SUPLENTES PANEL */}
        <div style={{flex:"1 1 0",display:"flex",flexDirection:"column",gap:5}}>
          <div style={{fontSize:9,fontWeight:800,letterSpacing:".15em",textTransform:"uppercase",color:"var(--muted)",marginBottom:2}}>// SUP</div>
          {supSorted.length===0 && (
            <div style={{fontSize:10,color:"var(--muted)",textAlign:"center",padding:"10px 4px",border:"1px dashed var(--border)",borderRadius:8}}>Sin<br/>suplentes</div>
          )}
          {supSorted.map(p=>(
            <div key={p.id} data-pos={p.position} style={{position:"relative",overflow:"hidden",background:"var(--card)",border:"1px solid var(--border)",borderRadius:10,padding:"7px 8px 7px 11px"}}>
              <div style={{position:"absolute",left:0,top:0,bottom:0,width:3,background:"var(--pc)",borderRadius:"10px 0 0 10px"}}/>
              <div style={{fontWeight:800,fontSize:11,lineHeight:1.2,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",color:"var(--fg)"}}>{p.name.split(" ")[0]}</div>
              <div style={{fontSize:9,marginTop:2,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <span style={{color:"var(--pc)",fontWeight:800,letterSpacing:".06em"}}>{POS_SHORT[p.position]}</span>
                <span style={{color:"var(--muted)"}}>#{p.number}</span>
              </div>
            </div>
          ))}
        </div>
      </div>

      <p className="muted mt14" style={{fontSize:11,textAlign:"center"}}>Tocá cualquier casillero para asignar o cambiar jugador</p>
      <div className="mt14" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <button className="btn outline block" onClick={autoFill}>AUTO-COMPLETAR</button>
        <button className="btn danger block" onClick={clearAll}><Icon name="trash" size={14}/> VACIAR XI</button>
      </div>
      <div style={{height:20}}/>
    </div>
    {picker && <SlotPickerModal
      match={match}
      slotIdx={picker.idx}
      role={picker.role}
      currentPid={lineup.slots[picker.idx]}
      usedIds={new Set(lineup.slots.filter(Boolean))}
      onAssign={(pid)=>assign(picker.idx,pid)}
      onClear={()=>clear(picker.idx)}
      onClose={()=>setPicker(null)}
    />}
  </>);
}

function SlotPickerModal({match,slotIdx,role,currentPid,usedIds,onAssign,onClear,onClose}){
  const [filter,setFilter]=useState("all"); // all | pos | avail
  const all = match.players||[];
  const list = all.filter(p=>{
    if(filter==="pos") return p.position===role;
    if(filter==="avail") return p.available;
    return true;
  }).sort((a,b)=>{
    const score=(p)=> (p.available?0:100) + (p.position===role?0:10) + ((usedIds.has(p.id)&&p.id!==currentPid)?5:0);
    return score(a)-score(b);
  });
  return (
    <Modal title={`${role} · SLOT ${slotIdx+1}`} onClose={onClose}>
      <div className="tabs mb10">
        <button className={"pill"+(filter==="all"?" active":"")} onClick={()=>setFilter("all")}>TODOS</button>
        <button className={"pill"+(filter==="pos"?" active":"")} onClick={()=>setFilter("pos")}>{POS_SHORT[role]}</button>
        <button className={"pill"+(filter==="avail"?" active":"")} onClick={()=>setFilter("avail")}>DISPONIBLES</button>
      </div>
      {currentPid && <button className="btn danger block mb10" onClick={onClear}><Icon name="trash" size={14}/> QUITAR DEL SLOT</button>}
      <div className="col g6" style={{maxHeight:"55vh",overflowY:"auto"}}>
        {list.map(p=>{
          const inOther = usedIds.has(p.id) && p.id!==currentPid;
          const tags=[];
          if(!p.available) tags.push("NO DISPONIBLE");
          if(inOther) tags.push("YA EN SLOT");
          if(p.position!==role) tags.push("POSICIÓN DISTINTA");
          return (
            <div key={p.id} data-pos={p.position} className="prow" style={{cursor:"pointer",opacity:p.available?1:.45}} onClick={()=>onAssign(p.id)}>
              <div className="num">{p.number}</div>
              <div className="name"><b>{p.name}</b><span>{tags.join(" · ") || "LISTO"}</span></div>
              {p.id===currentPid && <span className="chip on">ACTUAL</span>}
            </div>
          );
        })}
      </div>
    </Modal>
  );
}

// ============ ROSTER / PLANTEL ============
function RosterScreen({state,setState,go}){
  const {players, champs} = state;
  const [modal,setModal]=useState(null);

  const byPos = useMemo(()=>{
    const g={ARQUERO:[],DEFENSOR:[],MEDIO:[],DELANTERO:[]};
    players.forEach(p=>g[p.position].push(p));
    Object.keys(g).forEach(k=>g[k].sort((a,b)=>(a.number||99)-(b.number||99)));
    return g;
  },[players]);
  const counts={};POSITIONS.forEach(p=>counts[p]=byPos[p].length);

  // OVR ranking across all champs played matches
  const ovrMap = useMemo(()=>{
    const map={};
    players.forEach(p=>map[p.id]={p,asist:0,tit:0,min:0,total:0});
    champs.forEach(c=>(c.matches||[]).filter(isPlayed).forEach(m=>{
      (m.players||[]).forEach(pp=>{
        const m2=map[pp.id]; if(!m2) return;
        m2.total++;
        if(pp.available)m2.asist++;
        if(pp.starter)m2.tit++;
        m2.min+=pp.timePlayed||0;
      });
    }));
    return Object.values(map).map(x=>({
      ...x,
      ovr: x.total?Math.round((x.asist/x.total*30)+(x.tit/x.total*40)+(x.min/x.total)*0.30):50
    })).sort((a,b)=>b.ovr-a.ovr);
  },[players,champs]);
  const top3 = ovrMap.slice(0,3);

  const save=(pl)=>{
    setState(s=>{
      const exists = s.players.find(p=>p.id===pl.id);
      const players = exists? s.players.map(p=>p.id===pl.id?{...p,...pl}:p) : [...s.players,{...pl,id:Date.now()}];
      // propagar cambios a partidos existentes
      const champs = s.champs.map(c=>({...c,matches:(c.matches||[]).map(m=>{
        const already = m.players.find(pp=>pp.id===(pl.id||-1));
        let mp = m.players;
        if(exists){
          mp = m.players.map(pp=>pp.id===pl.id?{...pp,name:pl.name,number:pl.number,position:pl.position}:pp);
        } else {
          const newId = players[players.length-1].id;
          mp = [...m.players, {id:newId,number:pl.number,name:pl.name,position:pl.position,available:false,unavReason:"",starter:false,timePlayed:0,paid:false,payMethod:""}];
        }
        return {...m,players:mp};
      })}));
      return {...s,players,champs};
    });
    setModal(null);
  };

  const remove=(id)=>{
    if(!confirm("¿Eliminar jugador?")) return;

              <div className="display" style={{fontSize:22,color:"var(--pc)"}}>{r.ovr}</div>
            </div>
          ))}
        </div>
      </>}

      <div className="sl">Roster</div>
      {POSITIONS.map(pos=>byPos[pos].length>0 && (
        <div key={pos}>
          <div className="muted upper" style={{fontSize:10,margin:"8px 4px 6px",color:POS_COLOR[pos]}}>{pos} <span style={{float:"right"}}>{byPos[pos].length}</span></div>
          <div className="col g6">
            {byPos[pos].map(p=>{

                <div key={p.id} data-pos={p.position} className="prow">

      ))}
      <div style={{height:30}}/>
    </div>
    {modal && <PlayerModal data={modal} onSave={save} onClose={()=>setModal(null)}/>}
  </>);
}

function CajaScreen({state,setState,go,matchId}){
  const {champs,activeChamp}=state;

  const match = matchId? champ?.matches.find(m=>m.id===matchId) : null;
  if(!match){
    // elegir partido
    const pending = (champ?.matches||[]).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
    return (<>
      <TBar left={<button className="back" onClick={()=>go("money")}><Icon name="back" size={18}/></button>} center="CAJA · ELEGIR PARTIDO"/>
      <div className="pad col g8">
        {pending.map(m=>(
          <div key={m.id} className="mrow" onClick={()=>go("caja",{matchId:m.id})}>
            <div className="date"><b>{(new Date(m.date+"T00:00:00")).getDate().toString().padStart(2,"0")}</b><span>{MESES[(new Date(m.date+"T00:00:00")).getMonth()]}</span></div>
            <div className="vs"><b>VS {m.rival}</b><span>{m.time} · ${m.cost?.toLocaleString()}</span></div>
          </div>
        ))}
      </div>

  }
  const avails = (match.players||[]).filter(p=>p.available);
  const perPlayer = avails.length? Math.round(((match.cost||0)/avails.length)*100)/100 : 0;
  const etf = avails.filter(p=>p.paid && p.payMethod==="ETF").reduce((a,p)=>a+perPlayer,0);
  const trns = avails.filter(p=>p.paid && p.payMethod==="TRNS").reduce((a,p)=>a+perPlayer,0);
  const paidCount = avails.filter(p=>p.paid).length;
  const falta = (match.cost||0) - etf - trns;

  const setPay=(pid,method)=>{
    setState(s=>({...s,champs:s.champs.map(c=>c.id!==champ.id?c:{...c,matches:c.matches.map(m=>m.id!==match.id?m:{...m,players:m.players.map(pp=>pp.id!==pid?pp:{...pp, paid: !(pp.paid && pp.payMethod===method), payMethod: (pp.paid && pp.payMethod===method)?"":method})})})}));
  };

  return (<>
    <TBar left={<button className="back" onClick={()=>go("matchDetail",{matchId:match.id})}><Icon name="back" size={18}/></button>} center={<span className="display" style={{fontSize:16}}>CAJA</span>}/>
    <div className="pad">
      <div className="muted upper" style={{fontSize:10,marginTop:6}}>VS {match.rival}</div>
      <div className="sl">Caja del partido</div>
      <div className="card">
        <div className="display" style={{fontSize:36}}>{fmtMoney(match.cost)}</div>
        <div className="muted upper" style={{fontSize:10}}>TOTAL ALQUILER · CANCHA {match.field}</div>
        <div className="flex between center mt10" style={{background:"var(--card2)",border:"1px solid var(--orange)",borderRadius:12,padding:"10px 12px"}}>
          <div><div className="muted upper" style={{fontSize:10}}>A PAGAR C/U</div><div className="display orange" style={{fontSize:24}}>{fmtMoney(perPlayer)}</div></div>
          <div style={{textAlign:"right"}}><div className="muted upper" style={{fontSize:10}}>DIVISOR</div><div className="display" style={{fontSize:24}}>{avails.length} JUG</div></div>
        </div>
      </div>

      <div className="mt14" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <div className="card" style={{borderLeft:"3px solid var(--win)"}}><div className="muted upper" style={{fontSize:10}}>EFECTIVO</div><div className="display" style={{color:"var(--win)",fontSize:26}}>{fmtMoney(etf)}</div></div>
        <div className="card" style={{borderLeft:"3px solid var(--def)"}}><div className="muted upper" style={{fontSize:10}}>TRANSFER</div><div className="display" style={{color:"var(--def)",fontSize:26}}>{fmtMoney(trns)}</div></div>

      <div className="sl">Quién pagó</div>

        {avails.map(p=>(

// ============ FINANZAS (Money tab) ============
function MoneyScreen({state,setState,go}){
  const {champs,players}=state;
  const [view,setView]=useState("finanzas"); // finanzas | stats
  // all played matches
  const allMatches=[];
  champs.forEach(c=>(c.matches||[]).filter(isPlayed).forEach(m=>allMatches.push({...m,champId:c.id,champName:c.name})));
  const totalCaja = allMatches.reduce((a,m)=>a+(m.cost||0),0);
  const entro = allMatches.reduce((a,m)=>{
    const paid = (m.players||[]).filter(p=>p.paid).length;
    const avail = (m.players||[]).filter(p=>p.available).length || 1;
    return a + Math.ceil((m.cost||0)/avail)*paid;
  },0);
  const salio = totalCaja;
  const neto = entro - salio;

  // histograma últimos 6 meses
  const hist = useMemo(()=>{
    const now=new Date();
    const buckets=[];
    for(let i=5;i>=0;i--){
      const d=new Date(now.getFullYear(),now.getMonth()-i,1);
      const k=`${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,"0")}`;
      buckets.push({k,label:MESES[d.getMonth()],value:0});
    }
    allMatches.forEach(m=>{
      const k = m.date?.slice(0,7);
      const b = buckets.find(x=>x.k===k);
      if(b) b.value += m.cost||0;
    });
    const max = Math.max(1,...buckets.map(b=>b.value));
    return {buckets,max};
  },[champs]);

  // deudores: jugadores que tienen partidos donde available=true y paid=false
  const deudores = useMemo(()=>{
    const map={};
    allMatches.forEach(m=>{
      const avail = (m.players||[]).filter(p=>p.available).length || 1;
      const perP = Math.ceil((m.cost||0)/avail);
      (m.players||[]).forEach(p=>{
        if(p.available && !p.paid){
          if(!map[p.id]) map[p.id]={player:p,matches:0,amount:0};
          map[p.id].matches++;
          map[p.id].amount += perP;
        }
      });
    });
    return Object.values(map).sort((a,b)=>b.amount-a.amount);
  },[champs]);

  return (<>
    <TBar left={<Logo/>} center={<span className="display" style={{fontSize:18}}>CLUB · 2026</span>} right={<button className="btn ghost sm" onClick={()=>setView(view==="finanzas"?"stats":"finanzas")}><Icon name={view==="finanzas"?"cog":"back"} size={18}/></button>}/>
    <div className="pad">
      <div className="tabs">
        <button className={"pill"+(view==="finanzas"?" active":"")} onClick={()=>setView("finanzas")}>FINANZAS</button>
        <button className={"pill"+(view==="stats"?" active":"")} onClick={()=>setView("stats")}>STATS</button>
        <button className="pill" onClick={()=>go("caja")}>CAJA X PARTIDO</button>
      </div>

      {view==="finanzas" && <>
        <div className="sl">Caja general · {MESES[new Date().getMonth()]}</div>
        <div className="card accent">
          <div className="display orange" style={{fontSize:42}}>{fmtMoney(Math.abs(neto))}</div>
          <div className="flex g10 mt10" style={{flexWrap:"wrap"}}>
            <div><div className="muted upper" style={{fontSize:9}}>ENTRÓ</div><div className="display" style={{color:"var(--win)"}}>+{fmtMoney(entro)}</div></div>
            <div><div className="muted upper" style={{fontSize:9}}>SALIÓ</div><div className="display" style={{color:"var(--loss)"}}>-{fmtMoney(salio)}</div></div>
            <div><div className="muted upper" style={{fontSize:9}}>NETO</div><div className="display orange">{neto>=0?"+":"-"}{fmtMoney(Math.abs(neto))}</div></div>
          </div>
        </div>

        <div className="sl">Últ. 6 meses</div>
        <div className="card">
          <div className="display" style={{fontSize:22,marginBottom:6}}>HISTORIAL</div>
          <div className="hist">
            {hist.buckets.map((b,i)=>(
              <div key={b.k} className={i===hist.buckets.length-1?"current":""} style={{height:((b.value/hist.max)*100)+"%"}}>
                <span>{b.label}</span>
              </div>
            ))}
          </div>
        </div>

        <div className="sl">Aviso · {deudores.length} garrones</div>
        <div className="col g6">
          {deudores.length===0 && <div className="card ghost"><div className="muted" style={{textAlign:"center",padding:"8px"}}>Nadie debe 🎉</div></div>}
          {deudores.map(d=>(
            <div key={d.player.id} className="deud">
              <div>
                <div style={{fontWeight:800}}>{d.player.name.split(" ").map((w,i)=>i===0?w:w[0]+".").join(" ")}</div>
                <div className="muted" style={{fontSize:11}}>{d.matches} PARTIDOS SIN PAGAR</div>
              </div>
              <b>{fmtMoney(d.amount)}</b>
            </div>
          ))}
        </div>
      </>}

      {view==="stats" && <StatsInner state={state} go={go}/>}

      <div style={{height:20}}/>
    </div>
  </>);
}

// ============ EXPORT PNG (simple canvas) ============
function canvasBase({w=720,h=1280,title,sub}){
  const c=document.createElement("canvas"); c.width=w; c.height=h;
  const x=c.getContext("2d");
  x.fillStyle="#0D0D0D";x.fillRect(0,0,w,h);
  x.fillStyle="#FF5C00";x.font="900 52px Archivo Black, system-ui";x.fillText("RESPETEN RANGOS FC",30,60);
  x.fillStyle="#F5F5F5";x.font="800 42px Archivo Black, system-ui";x.fillText(title,30,120);
  if(sub){x.fillStyle="#8A8A8A";x.font="600 22px Archivo, system-ui";x.fillText(sub,30,155)}
  return {c,x};
}
function download(c,name){c.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;a.click()})}
function downloadPDF(canvas,name){
  const jsPDF=(window.jspdf||{}).jsPDF;
  if(!jsPDF){alert("jsPDF no cargó. Verificá conexión.");return;}
  const landscape=canvas.width>canvas.height;
  const pdf=new jsPDF({orientation:landscape?"l":"p",unit:"px",format:[canvas.width,canvas.height],hotfixes:["px_scaling"]});
  pdf.addImage(canvas.toDataURL("image/png"),"PNG",0,0,canvas.width,canvas.height);
  pdf.save(name);
}

function exportAvailsPNG(match){
  const avails=(match.players||[]).filter(p=>p.available);
  const H=Math.max(800, 260 + avails.length*34 + 80);
  const W=720;
  const c=document.createElement("canvas"); c.width=W; c.height=H;
  const x=c.getContext("2d");
  x.drawImage(SHARED_LOGO, 30, 20, 50, 50);
  x.fillStyle="#FF5C00";x.font="900 36px 'Archivo Black', system-ui";x.fillText("RESPETEN RANGOS FC", 90, 56);
  x.fillStyle="#F5F5F5";x.font="900 40px 'Archivo Black', system-ui";x.fillText(`VS ${match.rival}`,30,114);
  x.fillStyle="#8A8A8A";x.font="600 20px Archivo, system-ui";x.fillText(`${fmtDateLong(match.date)} · ${match.time} · Cancha ${match.field}`,30,148);
  x.fillStyle="#22C55E";x.font="900 26px 'Archivo Black', system-ui";x.fillText(`✓ DISPONIBLES  ${avails.length}/${match.players.length}`,30,200);
  let y=240;
  POSITIONS.forEach(pos=>{
    const list=avails.filter(p=>p.position===pos);
    if(!list.length) return;
    x.fillStyle={ARQUERO:"#F59E0B",DEFENSOR:"#3B82F6",MEDIO:"#22C55E",DELANTERO:"#EF4444"}[pos];
    x.font="900 18px 'Archivo Black', system-ui";x.fillText(pos,30,y);y+=30;
    list.forEach(p=>{
      x.fillStyle="#F5F5F5";x.font="600 20px Archivo, system-ui";
      x.fillText(`#${p.number}  ${p.name}`,50,y);y+=28;
    });
    y+=10;
  });
  download(c,`disponibles_${match.rival}.png`);
}

function exportMatchPromoPNG(match){
  const W=1080;
  const H=1920; 
  const c=document.createElement("canvas"); c.width=W; c.height=H;
  const x=c.getContext("2d");
  
  const grad = x.createLinearGradient(0,0,W,H);

function exportSquadListPNG(match, filter) {
  let list = match.players || [];
  if (filter === "yes") {
    list = list.filter(p => p.available);
  } else if (filter === "pending") {
    list = list.filter(p => p.available || p.unavReason === "PENDING");
  }

  const avails = list.filter(p => p.available);
  const perPlayer = avails.length ? Math.round(((match.cost||0)/avails.length)*100)/100 : 0;

  const W = 1080;
  const HEADER = 280;
  const ROW = 76;
  const TITLE_H = 50;
  
  // Agrupar por posición
  const POSITIONS_ARR = ["ARQUERO", "DEFENSOR", "MEDIO", "DELANTERO"];
  const grouped = {};
  POSITIONS_ARR.forEach(pos => {
     grouped[pos] = list.filter(p => p.position === pos).sort((a,b)=>(a.number||99)-(b.number||99));
  });

  // Calcular alturas de columnas
  let y0 = HEADER;
  let y1 = HEADER;
  const blocks = [];

  POSITIONS_ARR.forEach(pos => {
     const pList = grouped[pos];
     if (pList.length === 0) return;
     
     // Elegir la columna más corta
     const col = y0 <= y1 ? 0 : 1;
     const startY = col === 0 ? y0 : y1;
     
     blocks.push({ pos, list: pList, col, startY });
     
     // Aumentar la altura de esa columna (Título + filas)
     const blockH = TITLE_H + pList.length * ROW;
     if (col === 0) y0 += blockH;
     else y1 += blockH;
  });

  const H = Math.max(y0, y1, HEADER + 100) + 100;

  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");

  // Minimalist dark background
  x.fillStyle = "#0D0D0D"; x.fillRect(0,0,W,H);

  // Logo
  x.drawImage(SHARED_LOGO, 60, 60, 130, 130);

  x.fillStyle = "#FF5C00"; x.font="900 22px 'Archivo Black', system-ui"; x.textAlign="left";
  x.fillText("RESPETEN RANGOS FC", 220, 95);

  x.fillStyle = "#F5F5F5"; x.font="900 52px 'Archivo Black', system-ui"; x.textAlign="left";
  x.fillText("SQUAD LIST", 220, 150);

  x.fillStyle = "#8FA397"; x.font="700 22px Archivo, system-ui";
  const stageStr = (match.stage&&match.stage!=="LIGA")?match.stage:"FECHA "+match.matchday;
  x.fillText(`VS ${match.rival} · ${stageStr}`.toUpperCase(), 220, 185);
  
  // Total y Cuota
  x.textAlign="right";
  x.fillStyle = "#22C55E"; x.font="900 32px 'Archivo Black', system-ui"; 
  x.fillText(`${list.length} JUGADORES`, W - 60, 130);
  
  if (match.cost > 0) {
      x.fillStyle = "#F5F5F5"; x.font="700 24px Archivo, system-ui"; 
      x.fillText(`CUOTA: ${fmtMoney(perPlayer)} C/U`, W - 60, 170);
  }
  x.textAlign="left";

  // Separator line
  x.fillStyle = "#222"; x.fillRect(60, 230, W-120, 2);

  blocks.forEach(block => {
      let py = block.startY;
      const px = 60 + block.col * (W/2 - 20);
      const cw = W/2 - 100;
      
      // Título de la Posición
      x.fillStyle = "#8FA397"; x.font="900 16px 'Archivo Black', system-ui"; x.textAlign="left";
      x.fillText(`${block.pos}S (${block.list.length})`, px, py + 30);
      py += TITLE_H;

      block.list.forEach(p => {
        // Subtle row background
        x.fillStyle = "rgba(255,255,255,0.03)"; x.fillRect(px, py, cw, ROW - 14);
        
        // Status setup
        let statusColor = "#8FA397";
        let statusText = "";
        if (!p.available) {
           if (p.unavReason === "PENDING") { statusColor = "#FACC15"; statusText = "PENDIENTE"; }
           else { statusColor = "#EF4444"; statusText = "NO JUEGA"; }
        } else {
           statusColor = "#22C55E"; statusText = "CONFIRMADO";
        }

        // Number block
        x.fillStyle = "rgba(255,255,255,0.03)"; x.fillRect(px, py, 60, ROW-14);
        x.fillStyle = "#8FA397"; x.font="900 18px 'Archivo Black', system-ui"; x.textAlign="center";
        x.fillText("#" + p.number, px+30, py+38);

        // Player Name
        x.textAlign="left";
        x.fillStyle = "#F5F5F5"; x.font="800 22px Archivo, system-ui";
        x.fillText(p.name, px+80, py+30);

        // Status
        x.fillStyle = statusColor; x.font="800 13px 'Archivo Black', system-ui"; x.textAlign="left";
        if (filter !== "yes") {
          x.fillText(statusText, px+80, py+50);
        }

        py += ROW;
      });
  });

  // Footer
  x.fillStyle="#555"; x.font="600 16px Archivo, system-ui"; x.textAlign="center";
  let filterDesc = filter === "yes" ? "Solo Confirmados" : (filter === "pending" ? "Confirmados + Pendientes" : "Plantel Completo");
  x.fillText(`Reporte de Disponibilidad (${filterDesc}) · Generado ` + new Date().toLocaleDateString("es-AR"), W/2, H - 40);

  download(c, `squad_${match.rival}.png`);
}

function buildPlayerReportCanvas(champ, playerId){
  const played = (champ.matches||[]).filter(isPlayed).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const rows = played.map(m=>{
    const pp = (m.players||[]).find(x=>x.id===playerId);
    return {
      m,
      stage: (m.stage&&m.stage!=="LIGA")?m.stage:"F"+m.matchday,
      label: `VS ${m.rival}`,
      date: fmtDateLong(m.date),
      avail: !!pp?.available,
      reason: pp?.unavReason||"",
      starter: !!pp?.starter,
      time: pp?.timePlayed||0,
    };
  });
  const player = (played[0]?.players||[]).find(x=>x.id===playerId)
              || (champ.matches||[]).flatMap(m=>m.players||[]).find(x=>x.id===playerId)
              || {name:"—",number:"—",position:"—"};
  const asist = rows.filter(r=>r.avail).length;
  const totalP = rows.length;
  const titGames = rows.filter(r=>r.avail && r.starter).length;
  const supGames = rows.filter(r=>r.avail && !r.starter && r.time>0).length;
  const avgMin = asist? Math.round(rows.filter(r=>r.avail).reduce((a,r)=>a+r.time,0)/asist) : 0;
  const titPct = asist? Math.round(titGames/asist*100):0;
  const supPct = asist? Math.round(supGames/asist*100):0;
  const asistPct = totalP? Math.round(asist/totalP*100):0;
  const POS_COL={ARQUERO:"#F59E0B",DEFENSOR:"#3B82F6",MEDIO:"#22C55E",DELANTERO:"#EF4444"};
  const W=820;
  const HEAD=240;
  const ROW=46;
  const FOOT=70;
  const H=HEAD + Math.max(1,rows.length)*ROW + FOOT + 30;
  const c=document.createElement("canvas"); c.width=W; c.height=H;
  const x=c.getContext("2d");
  x.fillStyle="#0D0D0D"; x.fillRect(0,0,W,H);
  // header
  x.drawImage(SHARED_LOGO, 30, 15, 45, 45);
  x.fillStyle="#FF5C00"; x.font="900 36px 'Archivo Black', system-ui"; x.fillText("RESPETEN RANGOS FC", 85, 50);
  x.fillStyle="#8A8A8A"; x.font="600 16px Archivo, system-ui"; x.fillText(`REPORTE · ${champ.name}`, 30, 78);
  // player card
  const pc = POS_COL[player.position]||"#FF5C00";
  x.fillStyle="#1A1A1A"; x.fillRect(30,98,W-60,110);
  x.fillStyle=pc; x.fillRect(30,98,5,110);
  x.fillStyle=pc+"33"; x.fillRect(50,118,60,40);
  x.fillStyle=pc; x.font="900 22px 'Archivo Black', system-ui"; x.textAlign="center"; x.fillText("#"+player.number, 80, 145); x.textAlign="start";
  x.fillStyle="#F5F5F5"; x.font="900 28px 'Archivo Black', system-ui"; x.fillText(player.name, 130, 140);
  x.fillStyle="#8A8A8A"; x.font="700 13px Archivo, system-ui"; x.fillText(player.position, 130, 162);
  // metrics
  const metrics=[
    {l:"ASIST", v:`${asist}/${totalP}`, p:asistPct, col:"#FF5C00"},
    {l:"TIT", v:`${titGames}/${asist}`, p:titPct, col:"#22C55E"},
    {l:"SUP", v:`${supGames}/${asist}`, p:supPct, col:"#3B82F6"},
    {l:"MIN", v:`${avgMin}%`, p:avgMin, col:"#FACC15"},
  ];
  const mw=(W-60-30)/4;
  metrics.forEach((m,i)=>{
    const mx = 50+i*(mw+10);
    const my = 178;
    x.fillStyle="#8A8A8A"; x.font="700 11px Archivo, system-ui"; x.fillText(m.l, mx, my-2);
    x.fillStyle=m.col; x.font="900 18px 'Archivo Black', system-ui"; x.fillText(m.v, mx, my+14);
    x.fillStyle="#2A2A2A"; x.fillRect(mx, my+20, mw-10, 6);
    x.fillStyle=m.col; x.fillRect(mx, my+20, Math.min(1,m.p/100)*(mw-10), 6);
  });
  // table header
  let y = HEAD;
  x.fillStyle="#222"; x.fillRect(30,y-22,W-60,28);
  x.fillStyle="#8A8A8A"; x.font="700 11px Archivo, system-ui";
  x.fillText("FECHA",         40,  y-4);
  x.fillText("PARTIDO",      130,  y-4);
  x.fillText("INSTANCIA",    340,  y-4);
  x.fillText("ASIST",        450,  y-4);
  x.fillText("ROL",          540,  y-4);
  x.fillText("% JUG",        630,  y-4);
  x.fillText("MOTIVO",       710,  y-4);
  rows.forEach((r,i)=>{
    const yy = y + i*ROW;
    if(i%2===1){ x.fillStyle="#141414"; x.fillRect(30,yy-2,W-60,ROW); }
    x.fillStyle="#F5F5F5"; x.font="600 14px Archivo, system-ui";
    x.fillText(r.date, 40, yy+22);
    x.fillStyle="#F5F5F5"; x.font="800 14px Archivo, system-ui";
    x.fillText(r.label, 130, yy+22);
    x.fillStyle="#8A8A8A"; x.font="700 12px Archivo, system-ui";
    x.fillText(r.stage, 340, yy+22);
    // asist
    x.fillStyle = r.avail?"#22C55E":"#EF4444";
    x.font="900 14px 'Archivo Black', system-ui";
    x.fillText(r.avail?"SÍ":"NO", 450, yy+22);
    // rol
    if(r.avail){
      const rol = r.starter?"TITULAR":(r.time>0?"SUPLENTE":"NO JUGÓ");
      x.fillStyle = r.starter?"#FACC15":(r.time>0?"#3B82F6":"#666");
      x.font="800 13px Archivo, system-ui";
      x.fillText(rol, 540, yy+22);
      // % jug
      x.fillStyle="#F5F5F5"; x.font="900 14px 'Archivo Black', system-ui";
      x.fillText(r.time+"%", 630, yy+22);
    } else {
      x.fillStyle="#666"; x.font="700 12px Archivo, system-ui";
      x.fillText("—", 540, yy+22);
      x.fillText("—", 630, yy+22);
      // motivo
      x.fillStyle="#EF4444"; x.font="700 12px Archivo, system-ui";
      x.fillText(r.reason||"—", 710, yy+22);
    }
  });
  if(rows.length===0){
    x.fillStyle="#666"; x.font="600 14px Archivo, system-ui"; x.textAlign="center";
    x.fillText("Sin partidos jugados en este campeonato", W/2, y+30); x.textAlign="start";
  }
  // foot
  x.fillStyle="#666"; x.font="600 12px Archivo, system-ui"; x.textAlign="center";
  x.fillText("% TIT y % SUP calculados sobre partidos asistidos · Generado "+new Date().toLocaleDateString("es-AR"), W/2, H-24);
  x.textAlign="start";
  return c;
}

function exportAllPlayerReportsPDF(champ){
  const jsPDF=(window.jspdf||{}).jsPDF;
  if(!jsPDF){alert("jsPDF no cargó.");return;}
  const ids = Array.from(new Set((champ.matches||[]).flatMap(m=>(m.players||[]).map(p=>p.id))));
  if(!ids.length){alert("No hay jugadores."); return;}
  let pdf=null;
  ids.forEach((id,i)=>{
    const c = buildPlayerReportCanvas(champ, id);
    if(i===0){
      pdf = new jsPDF({orientation: c.width>c.height?"l":"p", unit:"px", format:[c.width,c.height], hotfixes:["px_scaling"]});

    pdf.addImage(c.toDataURL("image/png"),"PNG",0,0,c.width,c.height);
  });
  pdf.save(`reportes_jugadores_${champ.name.replace(/\s+/g,"_")}.pdf`);
}

  });
  // footer
  x.fillStyle="#666"; x.font="600 14px Archivo, system-ui"; x.textAlign="center";
  x.fillText("MIN = % promedio del partido jugado · Generado "+new Date().toLocaleDateString("es-AR"), W/2, H-24);
  x.textAlign="start";
  downloadPDF(c, `stats_${champ.name.replace(/\s+/g,"_")}.pdf`);
}

// ============ ROOT ============
function App(){
  const [players,setPlayers]=useState(()=>load("rrfc_p4",SEED_PLAYERS));
  const [champs,setChamps]=useState(()=>{
    const c=load("rrfc_c4",null);
    if(c) return c;
    const apertura = {id:Date.now(),name:"APERTURA 2026",matches:[]};
    return [apertura];
  });
  const [activeChamp,setActiveChamp]=useState(()=>{
    const loaded=load("rrfc_c4",null);
    return loaded?.[0]?.id || null;
  });
  const [tab,setTab]=useState("home");
  const [route,setRoute]=useState({name:"home"});

  const state = {players,champs,activeChamp};
  const setState = (updater)=>{
    const next = typeof updater==="function"? updater(state) : updater;
    if(next.players!==undefined) setPlayers(next.players);
    if(next.champs!==undefined) setChamps(next.champs);
    if(next.activeChamp!==undefined) setActiveChamp(next.activeChamp);
  };

  useEffect(()=>save("rrfc_p4",players),[players]);
  useEffect(()=>{save("rrfc_c4",champs);if(!activeChamp&&champs[0])setActiveChamp(champs[0].id)},[champs]);

  const go=(name,params={})=>setRoute({name,...params});

  // Sync tab with routes
  useEffect(()=>{
    const map={home:"home",matches:"matches",matchDetail:"matches",formacion:"matches",caja:"matches",roster:"roster",money:"money",stats:"money",settings:"home"};
    setTab(map[route.name]||"home");
  },[route.name]);

  // When pressing nav
  const navTab=(t)=>{setTab(t);if(t==="home")go("home");else if(t==="matches")go("matches");else if(t==="roster")go("roster");else if(t==="money")go("money");};

  let Screen;
  switch(route.name){
    case"matches": Screen=<MatchesScreen state={state} setState={setState} go={go}/>; break;
    case"matchDetail": Screen=<MatchDetailScreen state={state} setState={setState} go={go} matchId={route.matchId}/>; break;
    case"formacion": Screen=<FormacionScreen state={state} setState={setState} go={go} matchId={route.matchId}/>; break;
    case"caja": Screen=<CajaScreen state={state} setState={setState} go={go} matchId={route.matchId}/>; break;
    case"roster": Screen=<RosterScreen state={state} setState={setState} go={go}/>; break;
    case"money":
    case"stats": Screen=<MoneyScreen state={state} setState={setState} go={go}/>; break;
    case"settings": Screen=<SettingsScreen state={state} setState={setState} go={go}/>; break;
    default: Screen=<HomeScreen state={state} setState={setState} go={go}/>;
  }

  return (
    <div className="app">
      {Screen}
      <NavBar tab={tab} setTab={navTab}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
